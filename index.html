<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Cart</title>
    <link rel="stylesheet" href="style (5).css">
</head>
<body>
    <h1>My shop</h1>

    <div class="container">
        <div class="products-container">
            <h2>Products</h2>
            <div id="products"></div>
        </div>

        <aside class="cart-container" id="cartPanel" aria-label="Shopping cart">
            <div class="cart-header">
                <h2>Cart</h2>
                <button class="cart-close" id="cartClose" aria-label="Close cart">&times;</button>
            </div>
            <div id="cart"></div>
            <div class="totalPrice">Total: $<span id="total">0</span></div>
        </aside>
    </div>

    <button class="cart-toggle" id="cartToggle" aria-expanded="true" aria-controls="cartPanel">
        Cart <span class="badge" id="cartCount">0</span>
    </button>

    <script src="script (3).js"></script>
</body>
</html>
